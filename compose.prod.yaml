version: "3.9"

services:
  redis:
    image: "redis:latest"
    container_name: redis_cars_and_beyond
    ports:
      - "6379:6379"
    volumes:
      - redis_cars_and_beyond_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction"]
    networks:
      - cars_and_beyond_network
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    dns:
      - 8.8.8.8
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  entities:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: backend_cars_and_beyond
    command: ["/bin/bash", "/commands/run_entities_server_dev.sh"]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/entities/fastapi
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
      - "8001:8000" # Legacy parsers host port, served by the same API.
    volumes:
      - ./entities:/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 3g
    cpus: 1.5
    restart: always
    depends_on:
      migrator:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  migrator:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: alembic_migrator_cars_and_beyond
    command: ["/bin/bash", "/commands/run_migration.sh"]
    volumes:
      - ./entities:/usr/entities/fastapi
    env_file:
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 512m
    cpus: 0.3
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_cars_and_beyond
    command:
      [
        "celery",
        "-A", "core.celery_config.app",
        "worker",
        "-P", "gevent",
        "-c", "5",
        "-Q", "car_parsing_queue",
        "--loglevel=INFO",
        "--prefetch-multiplier=1"
      ]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - CELERY_GEVENT=1
      - PYTHONPATH=/usr/entities/fastapi
      - ENTITIES_BROKER_URL=redis://redis:6379/1
      - ENTITIES_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 4g
    cpus: 1.7
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_worker_cars_and_beyond
    command:
      [
        "celery",
        "-A", "core.integration_celery.app",
        "worker",
        "-P", "solo",
        "-Q", "celery",
        "--loglevel=info",
        "--prefetch-multiplier=1"
      ]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
      - INTEGRATION_BROKER_URL=redis://redis:6379/0
      - INTEGRATION_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 4.5g
    cpus: 2.1
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraping_worker:
    build:
      context: .
      dockerfile: entities/Dockerfile
      target: scraping
    container_name: scraping_worker_cars_and_beyond
    command:
      [
        "celery",
        "-A", "core.integration_celery.app",
        "worker",
        "-P", "solo",
        "-Q", "scraping",
        "--loglevel=info",
        "--prefetch-multiplier=1"
      ]
    env_file:
      - ./entities/.env
      - path: ./parsers/.env
        required: false
    environment:
      - PYTHONPATH=/usr/entities/fastapi
      - INTEGRATION_BROKER_URL=redis://redis:6379/0
      - INTEGRATION_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
      - scraping_state:/var/lib/entities-scraping
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 4.5g
    cpus: 2.1
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_beat_cars_and_beyond
    command: ["celery", "-A", "core.integration_celery.app", "beat", "--loglevel=info", "--schedule=/var/lib/celery/integrations-schedule"]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
      - INTEGRATION_BROKER_URL=redis://redis:6379/0
      - INTEGRATION_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
      - celery_beat_state:/var/lib/celery
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 384m
    cpus: 0.2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat_entities:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_beat_entities_cars_and_beyond
    command: ["celery", "-A", "core.celery_config.app", "beat", "--loglevel=info", "--schedule=/var/lib/celery/entities-schedule"]
    env_file:
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
      - ENTITIES_BROKER_URL=redis://redis:6379/1
      - ENTITIES_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
      - celery_beat_state:/var/lib/celery
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 384m
    cpus: 0.2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./key.pem:/etc/nginx/certs/key.pem:ro
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/static/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - entities
    env_file:
      - ./docker/nginx/.env
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    mem_limit: 384m
    cpus: 0.2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  celery_beat_state:
    driver: local
  scraping_state:
    driver: local
  redis_cars_and_beyond_data:
    driver: local

networks:
  cars_and_beyond_network:
    driver: bridge
