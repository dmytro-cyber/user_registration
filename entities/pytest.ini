[pytest]
pythonpath = .
testpaths =
    tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    integration: mark a test as integration
    postgres: requires a disposable local PostgreSQL cluster (--run-postgres)
    scraping_runtime: requires browser/OCR binaries (--run-scraping-runtime)

asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
asyncio_mode = auto

addopts =
    -ra
    --strict-markers
    --disable-warnings
    -q

filterwarnings =
    ignore:Pydantic V1 style .* validators are deprecated:DeprecationWarning
    ignore:regex has been deprecated, please use pattern instead:DeprecationWarning

log_cli = false

log_level = ERROR
