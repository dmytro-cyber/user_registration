name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: entities • lint + contracts + PostgreSQL
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: entities
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 2.0.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: entities/.venv
          key: venv-entities-${{ runner.os }}-py312-${{ hashFiles('entities/poetry.lock') }}
      - name: Install dependencies including scraping tests
        run: poetry install --no-root --with scraping --no-interaction --no-ansi
      - name: Install PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Ruff check
        run: poetry run ruff check .
      - name: Run tests with disposable PostgreSQL
        run: poetry run pytest --run-postgres --postgres-bin=/usr/lib/postgresql/16/bin
  container-runtime:
    name: API and scraping images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build lean API image from lockfile
        run: docker build -f entities/Dockerfile --target api -t entities-api:test .
      - name: Verify API starts without browser dependencies
        run: >
          docker run --rm entities-api:test python -c
          "import sys; import tests.conftest; import main;
          assert 'playwright' not in sys.modules; assert 'pytesseract' not in sys.modules"
      - name: Build scraping image
        run: docker build -f entities/Dockerfile --target scraping -t entities-scraping:test .
      - name: Verify Playwright, Selenium, Cairo and OCR runtime
        run: >
          docker run --rm --shm-size=1g entities-scraping:test
          pytest tests/runtime --run-scraping-runtime
