version: "3.9"

services:
  db:
    image: "postgres:15.6"
    container_name: postgres_cars_and_beyond
    env_file:
      - ./entities/.env
    ports:
      - "5432:5432"
    volumes:
      - ./entities/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_cars_and_beyond_data:/var/lib/postgresql/data/
    networks:
      - cars_and_beyond_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d a -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_cars_and_beyond
    ports:
      - "3333:80"
    env_file:
      - ./entities/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_cars_and_beyond_data:/var/lib/pgadmin
    networks:
      - cars_and_beyond_network

  redis:
    image: "redis:latest"
    container_name: redis_cars_and_beyond
    ports:
      - "6379:6379"
    volumes:
      - redis_cars_and_beyond_data:/var/lib/data
    networks:
      - cars_and_beyond_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # One-shot мігратор: завершується з кодом 0 при успіху
  migrator:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: alembic_migrator_cars_and_beyond
    command: ["/bin/bash", "/commands/run_migration.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./entities:/usr/entities/fastapi
    env_file:
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8
    restart: "no"

  entities:
    restart: always
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: backend_cars_and_beyond
    command: ["/bin/bash", "/commands/run_entities_server_dev.sh"]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/entities/fastapi
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
      - "8001:8000" # Legacy parsers host port, served by the same API.
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
    networks:
      - cars_and_beyond_network

  minio:
    image: minio/minio:latest
    container_name: minio_cars_and_beyond
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./entities/.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cars_and_beyond_network

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    container_name: minio_mc_cars_and_beyond
    command: ["/bin/sh", "-c", "/commands/setup_minio.sh"]
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./entities/.env
    networks:
      - cars_and_beyond_network


  celery:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_cars_and_beyond
    command:
      [
        "celery",
        "-A", "core.celery_config.app",
        "worker",
        "-P", "gevent",
        "-c", "50",
        "-Q", "car_parsing_queue",
        "--loglevel=INFO"
      ]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      PYTHONPATH: /usr/entities/fastapi
      CELERY_GEVENT: "1"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8

  celery_worker:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_worker_cars_and_beyond
    command: ["celery", "-A", "core.integration_celery.app", "worker", "-P", "solo", "-Q", "celery", "--loglevel=info"]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8

  scraping_worker:
    build:
      context: .
      dockerfile: entities/Dockerfile
      target: scraping
    container_name: scraping_worker_cars_and_beyond
    command: ["celery", "-A", "core.integration_celery.app", "worker", "-P", "solo", "-Q", "scraping", "--loglevel=info"]
    env_file:
      - ./entities/.env
      - path: ./parsers/.env
        required: false
    environment:
      - PYTHONPATH=/usr/entities/fastapi
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
      - scraping_state:/var/lib/entities-scraping
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8

  celery_beat:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_beat_cars_and_beyond
    command: ["celery", "-A", "core.integration_celery.app", "beat", "--loglevel=info", "--schedule=/var/lib/celery/integrations-schedule"]
    env_file:
      - path: ./parsers/.env
        required: false
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
      - celery_beat_state:/var/lib/celery
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8

  celery_beat_entities:
    build:
      context: .
      dockerfile: entities/Dockerfile
    container_name: celery_beat_entities_cars_and_beyond
    command: ["celery", "-A", "core.celery_config.app", "beat", "--loglevel=info", "--schedule=/var/lib/celery/entities-schedule"]
    env_file:
      - ./entities/.env
    environment:
      - PYTHONPATH=/usr/entities/fastapi
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - ./entities:/usr/entities/fastapi
      - celery_beat_state:/var/lib/celery
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8

  nginx:
    build:
      context: .
    #   dockerfile: docker/nginx/Dockerfile
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./key.pem:/etc/nginx/certs/key.pem:ro
      - ./configs/nginx/nginx_local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      entities:
        condition: service_started
    env_file:
      - ./docker/nginx/.env
    networks:
      - cars_and_beyond_network
    dns:
      - 8.8.8.8

volumes:
  celery_beat_state:
    driver: local
  scraping_state:
    driver: local
  postgres_cars_and_beyond_data:
    driver: local
  pgadmin_cars_and_beyond_data:
    driver: local
  redis_cars_and_beyond_data:
    driver: local
  minio_data:
    driver: local
  nginx:
    driver: local

networks:
  cars_and_beyond_network:
    driver: bridge
